<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Ads AI Mentor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <!-- Header with title on the left and a 'New Chat' button on the right -->
        <header class="app-header">
            <div>
                <h1>Meta Ads AI Mentor</h1>
                <p>Strategy, Copywriting, Targeting & Learning</p>
            </div>
            <button id="new-chat-btn" class="new-chat-btn">New Chat</button>
        </header>

        <!-- Chat history area -->
        <main id="chat-box" class="chat-box">
            <div class="message ai-message">
                Hello! I am your Meta Ads AI Mentor. Click one of the quick tools below or ask me anything about your campaign!
            </div>
        </main>

        <!-- Quick-Action Buttons so you don't have to type long prompts from scratch -->
        <div class="quick-actions">
            <button class="action-btn" data-action="strategy">🗺️ Build Strategy</button>
            <button class="action-btn" data-action="copy">✍️ Write 3 Ad Copies</button>
            <button class="action-btn" data-action="targeting">🎯 Targeting & Budget</button>
            <button class="action-btn" data-action="analyze">📊 Analyze My Metrics</button>
        </div>

        <!-- Bottom typing area -->
        <footer class="input-area">
            <textarea 
                id="user-input" 
                placeholder="Ask about ad strategy, targeting, or ad copy..." 
                rows="3"
            ></textarea>
            <button id="send-btn">Send</button>
        </footer>

    </div>

    <script src="app.js"></script>
</body>
</html>
